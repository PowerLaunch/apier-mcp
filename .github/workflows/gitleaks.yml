# NOTE: This is a dedicated secret scanning workflow, not the CI pipeline.
# tsc and vitest run in ci.yml (with a tarball audit) — not duplicated here.
name: "Gitleaks Secret Scan"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

# Actions tracked at @v4 / @v2 (major tags) per PowerLaunch org convention,
# matching the monorepo. SHA-pinning deferred for org-wide consistency (PR #10).
jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

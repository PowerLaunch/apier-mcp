name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        # Using `npm install` (not `npm ci`) so a lock file generated
        # on one platform (e.g. Windows dev machine) doesn't fail on
        # another (Linux CI) when platform-specific optional deps
        # like @emnapi/core differ. Slightly slower than `npm ci` but
        # cross-platform reliable.
        run: npm install --no-audit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Release

on:
  push:
    tags: ['v*.*.*']

# Serialize releases: never cancel a publish mid-flight, and don't let two
# tag pushes publish concurrently (Cursor Bugbot, Low).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Least privilege by default: NO id-token at the workflow level. Only the
# `publish` job opts into id-token: write at the job level (PR-11).
permissions:
  contents: read

jobs:
  build-audit:
    runs-on: ubuntu-latest
    if: github.repository == 'PowerLaunch/apier-mcp'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      - name: Type-check
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Pack + audit
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack /tmp/unpack
          TARBALL="$(npm pack --pack-destination /tmp/pack)"
          tar -xzf "/tmp/pack/$TARBALL" -C /tmp/unpack
          BAD=$(find /tmp/unpack/package -type f \
                | sed 's|/tmp/unpack/package/||' \
                | grep -vE '^(dist/.*|README\.md|SECURITY\.md|LICENSE|package\.json)$' || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: tarball contains files outside allowlist:"
            echo "$BAD"
            exit 1
          fi
          if grep -rEn \
            'BEGIN [A-Z ]*PRIVATE KEY|apier_(live|test)_[A-Za-z0-9_-]{8,}|Bearer[[:space:]]+[A-Za-z0-9._+/=-]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' \
            /tmp/unpack/ ; then
            echo "ERROR: secret-shaped string in tarball"
            exit 1
          fi
      - name: Upload audited tarball
        uses: actions/upload-artifact@v4
        with:
          name: mcp-tarball
          path: /tmp/pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build-audit
    runs-on: ubuntu-latest
    if: github.repository == 'PowerLaunch/apier-mcp'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Upgrade npm for OIDC Trusted Publishing (requires npm >= 11.5.1)
        run: npm install -g npm@11
      - name: Configure npm registry for OIDC
        # Do NOT use setup-node's registry-url input: it writes
        # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc, and with no
        # NODE_AUTH_TOKEN that empty token forces npm down the classic-token path and blocks
        # OIDC Trusted Publishing. Point npm at the registry without writing an authToken line.
        run: npm config set registry https://registry.npmjs.org/
      - name: Download audited tarball
        uses: actions/download-artifact@v4
        with:
          name: mcp-tarball
      - name: Publish
        run: npm publish "./$(ls *.tgz)" --provenance --access public --ignore-scripts

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Upgrade npm for OIDC Trusted Publishing (requires npm >= 11.5.1)
        run: npm install -g npm@latest
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      - name: Type-check
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Pack + audit
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack /tmp/unpack
          npm pack --pack-destination /tmp/pack
          tar -xzf /tmp/pack/*.tgz -C /tmp/unpack
          BAD=$(find /tmp/unpack/package -type f \
                | sed 's|/tmp/unpack/package/||' \
                | grep -vE '^(dist/.*|README\.md|SECURITY\.md|LICENSE|package\.json)$' || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: tarball contains files outside allowlist:"
            echo "$BAD"
            exit 1
          fi
          if grep -rEn \
            'BEGIN [A-Z ]*PRIVATE KEY|apier_(live|test)_[A-Za-z0-9_-]{8,}|Bearer\s+[A-Za-z0-9._+/=-]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' \
            /tmp/unpack/ ; then
            echo "ERROR: secret-shaped string in tarball"
            exit 1
          fi
      - name: Publish
        # --ignore-scripts so prepublishOnly does NOT rebuild dist/ after the
        # Pack + audit step packed & scanned it — keeps the published artifact
        # byte-identical to the audited one (Cursor Bugbot, Medium).
        run: npm publish --provenance --access public --ignore-scripts

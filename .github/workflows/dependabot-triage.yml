# Dependabot triage: every Dependabot PR either merges itself after CI passes
# or reaches Tony's phone. Nothing waits to be found by chance.
#
#   a) semver patch or minor of ONE npm dependency whose current version is
#      >= 1.0.0: squash auto-merge, which merges only after CI passes.
#   b) a major bump, a bump from 0.x (where a minor can break), a grouped
#      update, a github-actions update (GITHUB_TOKEN cannot merge workflow
#      changes) or anything fetch-metadata cannot classify: no auto-merge, ONE
#      ntfy push with the PR title and link when the PR opens.
#   c) CI fails on a Dependabot PR: ONE ntfy push per failed CI run, with the
#      PR link and the failing jobs.
#   d) Safety net, daily at 08:00 Oslo time (and on demand): ONE ntfy push per
#      open Dependabot PR older than 24 hours, per day, with its link, how long
#      it has been open and its check state. This catches a rule (a) PR that
#      did not merge for any reason (a check still pending after the wait, a
#      failed merge, a conflict) as well as a rule (b) PR nobody has merged.
#
# CI must pass before anything merges, even while CI is not yet a required
# check on main. Auto-merge is enabled up front only when main requires every
# check in CI_CHECKS; otherwise rule (a) PRs get the `dependabot-automerge`
# label and the `ci-result` job squash-merges them directly, pinned to the
# head that passed, only after CI succeeded on the PR's current head and every
# check on that head, Gitleaks included, is green. Checks still running are
# waited for, up to 10 minutes; a failed merge sends ONE push. A PR that turns
# into rule (b) loses the label and any auto-merge.
#
# Security: pull_request_target and workflow_run run with a write token in the
# base repository, so no step ever checks out or runs code from the PR. Values
# from the PR (title, branch, URL) reach shell only through env vars, never
# through ${{ }} inside a script. The ntfy topic is a secret: it is only ever
# read from env and never printed (curl output goes to /dev/null, because
# ntfy's response body echoes the topic).
name: Dependabot triage

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    # cron runs in UTC only. 08:00 Europe/Oslo is 06:00 UTC in summer time and
    # 07:00 UTC in winter time, so both are scheduled and the safety-net job
    # goes ahead only for the one that is 08:00 in Oslo on that date.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions: {}

env:
  # Check names that must all be present and green before a rule (a) PR
  # merges: the CI jobs from ci.yml plus Gitleaks from gitleaks.yml. Auto-merge
  # is enabled up front only when main requires every one of them.
  CI_CHECKS: 'build (20),build (22),tarball-audit,Gitleaks'
  AUTOMERGE_LABEL: dependabot-automerge
  # Turns a PR's statusCheckRollup into {failed, pending, total}. A check is
  # pending while it runs, and a name in $required (comma-separated) that has
  # not reported yet counts as pending too, so an early "all green" can never
  # come from a check that simply has not started.
  CHECK_STATE_JQ: |
    [.statusCheckRollup[]
     | {name: (.name // .context),
        s: (if .__typename == "CheckRun" then
              (if .status != "COMPLETED" then "pending"
               elif ((.conclusion // "") | IN("SUCCESS","NEUTRAL","SKIPPED")) then "green"
               else "failed" end)
            else
              (if .state == "SUCCESS" then "green"
               elif ((.state // "") | IN("PENDING","EXPECTED")) then "pending"
               else "failed" end)
            end)}] as $checks
    | ([$checks[].name]) as $seen
    | {failed: [$checks[] | select(.s == "failed") | .name],
       pending: ([$checks[] | select(.s == "pending") | .name]
                 + [$required | split(",")[] | select(. as $r | $seen | index($r) | not)]),
       total: ($checks | length)}

jobs:
  triage:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'PowerLaunch/apier-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: dependabot-triage-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # v3.1.0
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify the update
        id: classify
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
        run: |
          set -euo pipefail
          decision=review
          reason=""
          major=""
          if [[ "$PREVIOUS_VERSION" =~ ^v?([0-9]+)\. ]]; then
            major="${BASH_REMATCH[1]}"
          fi
          if [ "$ECOSYSTEM" != "npm_and_yarn" ]; then
            reason="ecosystem ${ECOSYSTEM:-unknown} needs a human merge"
          elif [ -n "${DEPENDENCY_GROUP:-}" ] || [ -z "$DEPENDENCY_NAMES" ] || [[ "$DEPENDENCY_NAMES" == *,* ]]; then
            reason="grouped or unnamed update"
          elif [ -z "$major" ]; then
            reason="current version '${PREVIOUS_VERSION}' is not semver"
          elif [ "$major" -eq 0 ]; then
            reason="current version ${PREVIOUS_VERSION} is 0.x, where a minor can break"
          elif [ "$UPDATE_TYPE" = "version-update:semver-patch" ] || [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
            decision=automerge
            reason="${UPDATE_TYPE#version-update:} bump from ${PREVIOUS_VERSION}"
          else
            reason="${UPDATE_TYPE:-unknown update type} from ${PREVIOUS_VERSION}"
          fi
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Decision: $decision ($reason)"

      - name: "Rule a: label, and enable auto-merge if main requires CI"
        if: steps.classify.outputs.decision == 'automerge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          gh label create "$AUTOMERGE_LABEL" --color 0e8a16 \
            --description "Dependabot patch/minor >= 1.0.0: merges after CI passes" --force \
            || echo "::warning::could not create or update label $AUTOMERGE_LABEL; adding it anyway"
          gh pr edit "$PR_URL" --add-label "$AUTOMERGE_LABEL"

          # Required checks from rulesets and from classic branch protection.
          required=$( {
            gh api "repos/$GH_REPO/rules/branches/$BASE_REF" \
              --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context'
            gh api "repos/$GH_REPO/branches/$BASE_REF" \
              --jq '.protection.required_status_checks.contexts // [] | .[]'
          } | sort -u )
          # Every name in CI_CHECKS must be required: if main required only
          # some of them (say Gitleaks alone), GitHub auto-merge would merge
          # before the rest of CI had passed.
          ci_required=true
          IFS=',' read -ra ci_checks <<< "$CI_CHECKS"
          for c in "${ci_checks[@]}"; do
            if ! grep -qxF "$c" <<< "$required"; then ci_required=false; fi
          done

          if [ "$ci_required" = true ]; then
            gh pr merge "$PR_URL" --auto --squash
            echo "Auto-merge (squash) enabled; GitHub merges once the required checks pass."
          else
            echo "::notice::$BASE_REF does not require all of $CI_CHECKS, so auto-merge waits for the ci-result job (after CI passes)."
          fi

      # A PR that was rule (a) and is now rule (b) (Dependabot updated it in
      # place to a major, 0.x or grouped bump) must lose everything that would
      # merge it: the label the ci-result job merges on, and any auto-merge
      # enabled earlier. Both commands are no-ops when there is nothing to undo.
      - name: "Rule b: remove the merge label and auto-merge"
        if: steps.classify.outputs.decision == 'review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -uo pipefail
          gh pr edit "$PR_URL" --remove-label "$AUTOMERGE_LABEL" >/dev/null 2>&1 || true
          gh pr merge "$PR_URL" --disable-auto >/dev/null 2>&1 || true
          echo "Rule b: $PR_URL carries no merge label and no auto-merge."

      - name: "Rule b: push for a manual review"
        if: >-
          steps.classify.outputs.decision == 'review' &&
          (github.event.action == 'opened' || github.event.action == 'reopened')
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REASON: ${{ steps.classify.outputs.reason }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "::warning::NTFY_TOPIC secret is not set; push skipped for $PR_URL"
            exit 0
          fi
          curl -fsS --max-time 20 -o /dev/null \
            -H "Title: apier-mcp: Dependabot PR needs your review" \
            -H "Click: $PR_URL" \
            -H "Tags: dependabot" \
            --data-binary "$PR_TITLE ($REASON). $PR_URL" \
            "https://ntfy.sh/$NTFY_TOPIC"
          echo "Push sent for $PR_URL"

  ci-result:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.repository == 'PowerLaunch/apier-mcp'
    runs-on: ubuntu-latest
    # Room for the merge step's 10-minute wait for checks still running.
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --head "$HEAD_BRANCH" --state open --author 'app/dependabot' \
            --json number,url,title,headRefOid,labels,autoMergeRequest --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "No open Dependabot PR for $HEAD_BRANCH"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "found=true"
            echo "number=$(jq -r .number <<< "$pr")"
            echo "url=$(jq -r .url <<< "$pr")"
            echo "current=$(jq -r --arg sha "$HEAD_SHA" '.headRefOid == $sha' <<< "$pr")"
            echo "labeled=$(jq -r --arg l "$AUTOMERGE_LABEL" '[.labels[].name] | index($l) != null' <<< "$pr")"
            echo "automerge_on=$(jq -r '.autoMergeRequest != null' <<< "$pr")"
            echo "title<<__TITLE_EOF__"
            jq -r .title <<< "$pr"
            echo "__TITLE_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: "Rule c: push when CI failed"
        if: >-
          steps.pr.outputs.found == 'true' &&
          github.event.workflow_run.conclusion != 'success' &&
          github.event.workflow_run.conclusion != 'cancelled' &&
          github.event.workflow_run.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
        run: |
          set -euo pipefail
          failed=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name' \
            | paste -sd ',' - | sed 's/,/, /g')
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "::warning::NTFY_TOPIC secret is not set; CI-failure push skipped for $PR_URL"
            exit 0
          fi
          curl -fsS --max-time 20 -o /dev/null \
            -H "Title: apier-mcp: CI failed on a Dependabot PR" \
            -H "Click: $PR_URL" \
            -H "Tags: dependabot,warning" \
            --data-binary "$PR_TITLE: CI $CONCLUSION (failing: ${failed:-see run}). $PR_URL  Run: $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC"
          echo "CI-failure push sent for $PR_URL"

      - name: "Rule a: merge only after CI passed"
        if: >-
          steps.pr.outputs.found == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          steps.pr.outputs.current == 'true' &&
          steps.pr.outputs.labeled == 'true' &&
          steps.pr.outputs.automerge_on != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          # Every check on the head must be finished and green, not only CI:
          # Gitleaks runs beside it and can still be running when CI finishes.
          # Wait for checks that are still running, polling every 30 seconds
          # for up to 10 minutes. A failed check, a moved head or a check that
          # is still pending after the wait leaves the PR alone; the daily
          # safety net reports it the next morning.
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            view=$(gh pr view "$PR_URL" --json state,headRefOid,statusCheckRollup)
            if [ "$(jq -r .state <<< "$view")" != "OPEN" ]; then
              echo "::notice::$PR_URL is no longer open; nothing to merge."
              exit 0
            fi
            if [ "$(jq -r .headRefOid <<< "$view")" != "$HEAD_SHA" ]; then
              echo "::notice::$PR_URL has a newer head than $HEAD_SHA; the CI run on that head decides."
              exit 0
            fi
            checks=$(jq --arg required "$CI_CHECKS" "$CHECK_STATE_JQ" <<< "$view")
            failed=$(jq -r '.failed | join(", ")' <<< "$checks")
            pending=$(jq -r '.pending | join(", ")' <<< "$checks")
            if [ -n "$failed" ]; then
              echo "::notice::Not merging $PR_URL; checks failed: $failed"
              exit 0
            fi
            if [ -z "$pending" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::notice::Not merging $PR_URL; still pending after 10 minutes: $pending. The daily safety net reports it."
              exit 0
            fi
            echo "Waiting 30 s for: $pending"
            sleep 30
          done

          # Merge directly, pinned to the head that passed, and never through
          # auto-merge: this job runs only while main does not require
          # CI_CHECKS, so auto-merge left enabled on a PR that is blocked for
          # another reason would later merge a NEWER head that no check has
          # passed (--match-head-commit binds only the call that enables it).
          if out=$(gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA" 2>&1); then
            echo "$out"
            echo "Squash-merged after every check passed on $HEAD_SHA."
            exit 0
          fi
          err=$(printf '%s' "$out" | tr '\r\n' '  ' | cut -c1-300)
          echo "::error::Squash-merge of $PR_URL failed: $err"
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "::warning::NTFY_TOPIC secret is not set; merge-failure push skipped for $PR_URL"
          else
            curl -fsS --max-time 20 -o /dev/null \
              -H "Title: apier-mcp: Dependabot merge failed" \
              -H "Click: $PR_URL" \
              -H "Tags: dependabot,warning" \
              --data-binary "$PR_TITLE: gh pr merge failed after every check passed: $err. $PR_URL" \
              "https://ntfy.sh/$NTFY_TOPIC" \
              || echo "::warning::merge-failure push could not be sent for $PR_URL"
          fi
          exit 1

  safety-net:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'PowerLaunch/apier-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: dependabot-safety-net
      cancel-in-progress: false
    steps:
      - name: Go ahead only at 08:00 Oslo time
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          day=$(TZ=Europe/Oslo date +%F)
          run=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run=true
          elif [[ "$SCHEDULE" =~ ^0\ ([0-9]+)\ \* ]]; then
            # The Oslo hour of the cron's own UTC slot on today's date, so a
            # run GitHub starts late still counts for the slot it belongs to.
            slot_hour=$(TZ=Europe/Oslo date -d "$(date -u +%F) ${BASH_REMATCH[1]}:00 UTC" +%H)
            if [ "$slot_hour" = "08" ]; then run=true; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "Event $EVENT_NAME, schedule '${SCHEDULE}', Oslo date $day: run=$run"

      # One push per PR per day: the PR numbers already pushed today are kept
      # in a cache entry keyed by the Oslo date, so a manual run on the same
      # day does not push them again.
      - name: Restore today's push record
        if: steps.gate.outputs.run == 'true'
        # v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .safety-net
          key: dependabot-safety-net-${{ steps.gate.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dependabot-safety-net-${{ steps.gate.outputs.day }}-

      - name: Push for each Dependabot PR open more than 24 hours
        id: scan
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          mkdir -p .safety-net
          touch .safety-net/pushed.txt
          now=$(date -u +%s)
          stale=$(gh pr list --author 'app/dependabot' --state open --limit 100 \
              --json number,title,url,createdAt,mergeStateStatus,statusCheckRollup \
            | jq -c --argjson now "$now" --arg required "$CI_CHECKS" \
                "def checkstate: ${CHECK_STATE_JQ};"'
                .[]
                | ($now - (.createdAt | fromdateiso8601)) as $age
                | select($age > 86400)
                | {number, title, url, merge: .mergeStateStatus, age: $age, checks: checkstate}')
          if [ -z "$stale" ]; then
            echo "No Dependabot PR has been open more than 24 hours."
            exit 0
          fi
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "::warning::NTFY_TOPIC secret is not set; safety-net pushes skipped"
          fi
          sent=0
          while IFS= read -r pr; do
            number=$(jq -r .number <<< "$pr")
            url=$(jq -r .url <<< "$pr")
            title=$(jq -r .title <<< "$pr")
            age=$(jq -r '.age as $s | "\($s / 86400 | floor) d \($s % 86400 / 3600 | floor) h"' <<< "$pr")
            state=$(jq -r '. as $pr | .checks as $c
              | if ($c.failed | length) > 0 then "failing: " + ($c.failed | join(", "))
                elif ($c.pending | length) > 0 then "pending: " + ($c.pending | join(", "))
                else "all \($c.total) checks green" end
              | . + ", merge state " + ($pr.merge // "UNKNOWN")' <<< "$pr")
            if grep -qxF "$number" .safety-net/pushed.txt; then
              echo "#$number already pushed today: open $age, $state"
              continue
            fi
            echo "#$number open $age, $state"
            [ -n "${NTFY_TOPIC:-}" ] || continue
            if curl -fsS --max-time 20 -o /dev/null \
                -H "Title: apier-mcp: Dependabot PR open $age" \
                -H "Click: $url" \
                -H "Tags: dependabot,hourglass" \
                --data-binary "$title. Open $age; checks $state. $url" \
                "https://ntfy.sh/$NTFY_TOPIC"; then
              echo "$number" >> .safety-net/pushed.txt
              sent=$((sent + 1))
            else
              echo "::warning::safety-net push could not be sent for $url"
            fi
          done <<< "$stale"
          echo "sent=$sent" >> "$GITHUB_OUTPUT"
          echo "Safety-net pushes sent: $sent"

      - name: Save today's push record
        if: always() && steps.gate.outputs.run == 'true' && steps.scan.outputs.sent != '' && steps.scan.outputs.sent != '0'
        # v6.1.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .safety-net
          key: dependabot-safety-net-${{ steps.gate.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are tracked at @v4 (major tag) per PowerLaunch org convention,
# matching the monorepo (PowerLaunch/apier). SHA-pinning was considered
# (CodeRabbit) and deferred for org-wide consistency (PR #10).
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Sanity — bin shebang present
        run: |
          set -euo pipefail
          head -1 dist/cli.js | grep -q '^#!/usr/bin/env node' || {
            echo "ERROR: dist/cli.js missing node shebang"
            exit 1
          }
      - name: Sanity — version printed by --version matches package.json
        run: |
          set -euo pipefail
          PKG_VER=$(node -p "require('./package.json').version")
          CLI_VER=$(node dist/cli.js --version 2>&1 | tail -1 | tr -d '[:space:]')
          if [ "$PKG_VER" != "$CLI_VER" ]; then
            echo "ERROR: package.json version ($PKG_VER) != CLI --version ($CLI_VER)"
            exit 1
          fi

  tarball-audit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Pack tarball
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack
          ls -la /tmp/pack/
      - name: Extract tarball
        run: |
          set -euo pipefail
          mkdir -p /tmp/unpack
          tar -xzf /tmp/pack/*.tgz -C /tmp/unpack
          echo "--- file list ---"
          find /tmp/unpack -type f | sort
      - name: Allowlist — only dist/, README.md, SECURITY.md, LICENSE, package.json
        run: |
          set -euo pipefail
          BAD=$(find /tmp/unpack/package -type f \
                | sed 's|/tmp/unpack/package/||' \
                | grep -vE '^(dist/.*|README\.md|SECURITY\.md|LICENSE|package\.json)$' || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: tarball contains files outside the allowlist:"
            echo "$BAD"
            exit 1
          fi
      - name: Blocklist — forbidden patterns must not appear anywhere
        run: |
          set -euo pipefail
          if find /tmp/unpack -type f \
              \( -name '.env*' -o -name '.npmrc' -o -name '*.pem' -o -name '*.key' \
                 -o -name '*.local.*' -o -name '.DS_Store' \) | grep -q .; then
            echo "ERROR: tarball contains forbidden filenames"
            exit 1
          fi
          if grep -rEn \
            'BEGIN [A-Z ]*PRIVATE KEY|apier_(live|test)_[A-Za-z0-9_-]{8,}|Bearer[[:space:]]+[A-Za-z0-9._+/=-]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' \
            /tmp/unpack/ ; then
            echo "ERROR: tarball contents include a secret-shaped string"
            exit 1
          fi
          echo "OK — tarball clean"

  # Gated live-auth smoke job (PR-083b). Exercises the built CLI against the
  # real www.apier.no MCP endpoint using a CI-only API key. Gating is split:
  # the job-level `if:` is the canonical-repo guard; the smoke STEP's `if:`
  # checks the secret via job-level env (CodeRabbit, Major: `secrets.*` is
  # unavailable in a job-level `if:` expression, so the secret-present test
  # must run at step level against env). The key is never `echo`'d — GitHub
  # auto-masks it in logs — and it is forwarded to the CLI only via the
  # APIER_API_KEY env var (which the CLI in turn passes onward via --header
  # argv after scrubbing it from the child env).
  live-auth:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.repository == 'PowerLaunch/apier-mcp' }}
    timeout-minutes: 5
    env:
      # Bind the secret to job-level env so the step-level `if:` below can
      # test it. env declared at the SAME step is not yet in scope when that
      # step's `if:` is evaluated, so the gating env MUST live at job level.
      APIER_API_KEY_CI: ${{ secrets.APIER_API_KEY_CI }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Live MCP smoke test against www.apier.no
        # Skip cleanly on forks / contributors without access to the secret.
        # On the canonical repo with the secret bound, env.APIER_API_KEY_CI is
        # the real value; on forks it is the empty string and this step is
        # skipped. The earlier steps (checkout/setup-node/install/build) still
        # run on forks but are inexpensive no-ops without this smoke step.
        if: ${{ env.APIER_API_KEY_CI != '' }}
        shell: bash
        env:
          # The CLI reads APIER_API_KEY. Reuse the job-env binding instead of
          # referencing secrets.* twice.
          APIER_API_KEY: ${{ env.APIER_API_KEY_CI }}
        run: |
          set -euo pipefail
          # mcp-remote treats stdin EOF as "client disconnected" and shuts down
          # immediately. If we close stdin the instant printf finishes, the
          # upstream initialize response never lands on stdout — that's exactly
          # what failed run 26563021894 (proxy connected, forwarded the
          # request, then shut down before the response could flow back).
          #
          # Fix: hold stdin open in a brace-group that polls /tmp/smoke.out for
          # a JSON-RPC frame; break as soon as one appears. node's stdout is
          # redirected to /tmp/smoke.out via the `>` on the RIGHT side of the
          # pipe, so the loop reads a file the node process writes — the pipe
          # carries stdin INTO node and the redirect carries stdout OUT to a
          # file; the two flows don't share a buffer, so no deadlock. Outer
          # `timeout 45` is the hard ceiling; inner poll caps at 30 × 1 s.
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"apier-mcp-ci-smoke","version":"1.0.0"}}}'
          # Pre-clear so we don't read frames from a previous job's leftover.
          : > /tmp/smoke.out
          : > /tmp/smoke.err
          {
            printf '%s\n' "$REQ"
            for i in $(seq 1 30); do
              if [ -s /tmp/smoke.out ] && grep -q '"jsonrpc":"2.0"' /tmp/smoke.out; then
                break
              fi
              sleep 1
            done
          } | timeout 45 node dist/cli.js --endpoint=https://www.apier.no/api/mcp \
            > /tmp/smoke.out 2> /tmp/smoke.err || true
          echo "--- captured stdout ---"; cat /tmp/smoke.out
          echo "--- captured stderr (redacted by proxy) ---"; cat /tmp/smoke.err
          # Loud-fail assertions. PASS only on a proper initialize result;
          # FAIL loudly on any -32001 frame (auth OR timeout) and on empty
          # output.
          [ -s /tmp/smoke.out ] || { echo "FAIL: /tmp/smoke.out is empty — no upstream frames arrived"; exit 1; }
          if grep -qE '"code":-32001' /tmp/smoke.out; then
            echo "FAIL: -32001 error frame on stdout (auth or timeout) — see captured output above"; exit 1
          fi
          grep -qE '"jsonrpc":"2\.0"' /tmp/smoke.out || { echo "FAIL: no JSON-RPC frame in stdout"; exit 1; }
          grep -qE '"id":\s*1\b' /tmp/smoke.out || { echo "FAIL: no response for the initialize id=1"; exit 1; }
          grep -qE '"result"\s*:' /tmp/smoke.out || { echo "FAIL: no result field on the initialize response"; exit 1; }
          echo "OK — live MCP handshake succeeded (initialize result received from upstream)"

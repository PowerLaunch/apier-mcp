name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # Using `npm install` (not `npm ci`) so a lock file generated
        # on one platform (e.g. Windows dev machine) doesn't fail on
        # another (Linux CI) when platform-specific optional deps
        # like @emnapi/core differ. Slightly slower than `npm ci` but
        # cross-platform reliable.
        run: npm install --no-audit

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

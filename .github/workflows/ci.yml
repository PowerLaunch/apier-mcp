name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are tracked at @v4 (major tag) per PowerLaunch org convention,
# matching the monorepo (PowerLaunch/apier). SHA-pinning was considered
# (CodeRabbit) and deferred for org-wide consistency (PR #10).
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Sanity — bin shebang present
        run: |
          set -euo pipefail
          head -1 dist/cli.js | grep -q '^#!/usr/bin/env node' || {
            echo "ERROR: dist/cli.js missing node shebang"
            exit 1
          }
      - name: Sanity — version printed by --version matches package.json
        run: |
          set -euo pipefail
          PKG_VER=$(node -p "require('./package.json').version")
          CLI_VER=$(node dist/cli.js --version 2>&1 | tail -1 | tr -d '[:space:]')
          if [ "$PKG_VER" != "$CLI_VER" ]; then
            echo "ERROR: package.json version ($PKG_VER) != CLI --version ($CLI_VER)"
            exit 1
          fi

  tarball-audit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Pack tarball
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack
          ls -la /tmp/pack/
      - name: Extract tarball
        run: |
          set -euo pipefail
          mkdir -p /tmp/unpack
          tar -xzf /tmp/pack/*.tgz -C /tmp/unpack
          echo "--- file list ---"
          find /tmp/unpack -type f | sort
      - name: Allowlist — only dist/, README.md, SECURITY.md, LICENSE, package.json
        run: |
          set -euo pipefail
          BAD=$(find /tmp/unpack/package -type f \
                | sed 's|/tmp/unpack/package/||' \
                | grep -vE '^(dist/.*|README\.md|SECURITY\.md|LICENSE|package\.json)$' || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: tarball contains files outside the allowlist:"
            echo "$BAD"
            exit 1
          fi
      - name: Blocklist — forbidden patterns must not appear anywhere
        run: |
          set -euo pipefail
          if find /tmp/unpack -type f \
              \( -name '.env*' -o -name '.npmrc' -o -name '*.pem' -o -name '*.key' \
                 -o -name '*.local.*' -o -name '.DS_Store' \) | grep -q .; then
            echo "ERROR: tarball contains forbidden filenames"
            exit 1
          fi
          if grep -rEn \
            'BEGIN [A-Z ]*PRIVATE KEY|apier_(live|test)_[A-Za-z0-9_-]{8,}|Bearer[[:space:]]+[A-Za-z0-9._+/=-]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' \
            /tmp/unpack/ ; then
            echo "ERROR: tarball contents include a secret-shaped string"
            exit 1
          fi
          echo "OK — tarball clean"

  # Gated live-auth smoke job (PR-083b). Exercises the built CLI against the
  # real www.apier.no MCP endpoint using a CI-only API key. The `if:` gate
  # skips this job cleanly on forks and on PRs from contributors without
  # access to APIER_API_KEY_CI — it is NOT a required check. The secret is
  # never `echo`'d; GitHub Actions auto-masks it in logs, and it is forwarded
  # to the CLI only via the APIER_API_KEY env var (which the CLI in turn
  # passes onward via --header argv after scrubbing it from the child env).
  live-auth:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.repository == 'PowerLaunch/apier-mcp' && secrets.APIER_API_KEY_CI != '' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Live MCP smoke test against www.apier.no
        shell: bash
        env:
          APIER_API_KEY: ${{ secrets.APIER_API_KEY_CI }}
        run: |
          set -eu
          # Send one JSON-RPC initialize on stdin, capture up to 45s of stdout,
          # then validate that a real JSON-RPC frame returned and no synthetic
          # auth-fail/timeout frame was emitted. The outer `timeout` will kill
          # the proxy cleanly; we don't pipefail on its exit code.
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"apier-mcp-ci-smoke","version":"1.0.0"}}}' \
            | timeout 45 node dist/cli.js --endpoint=https://www.apier.no/api/mcp \
            > /tmp/smoke.out 2> /tmp/smoke.err || true
          echo "--- captured stdout ---"; cat /tmp/smoke.out
          echo "--- captured stderr (redacted by proxy) ---"; cat /tmp/smoke.err
          grep -qE '"jsonrpc":"2\.0"' /tmp/smoke.out || { echo "FAIL: no JSON-RPC frames in stdout"; exit 1; }
          if grep -qE '"code":-32001.*"Authentication failed' /tmp/smoke.out; then
            echo "FAIL: auth-fail frame — APIER_API_KEY_CI rejected by upstream"; exit 1
          fi
          if grep -qE '"code":-32001.*"Request timed out' /tmp/smoke.out; then
            echo "FAIL: timeout frame — proxy idle watchdog fired"; exit 1
          fi
          echo "OK — live MCP handshake succeeded"
